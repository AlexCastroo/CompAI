[project]
name = "compai"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["I", "UP", "B", "F", "E4", "E7", "E9"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
